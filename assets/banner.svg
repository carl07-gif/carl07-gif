<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="orb-violet" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>

    <!-- Isometric Cube 1 Gradients -->
    <linearGradient id="c1-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="c1-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <linearGradient id="c1-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Isometric Cube 2 Gradients -->
    <linearGradient id="c2-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="c2-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="c2-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Glass Pill Gradients -->
    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feFlood flood-color="#000000" flood-opacity="0.6" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 2px;
      fill: url(#text-grad);
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #818CF8;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      font-weight: 500;
      fill: #94A3B8;
      letter-spacing: 0.5px;
    }
    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #E2E8F0;
    }
    .grid-line {
      stroke: rgba(99, 102, 241, 0.08);
      stroke-width: 1;
    }
  </style>

  <!-- Card Frame -->
  <rect x="2" y="2" width="876" height="256" rx="16" fill="url(#bg-grad)" stroke="#1F2937" stroke-width="1.5" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="80" r="160" fill="url(#orb-violet)" />
  <circle cx="750" cy="180" r="180" fill="url(#orb-cyan)" />
  <circle cx="680" cy="60" r="140" fill="url(#orb-purple)" />

  <!-- 3D Isometric Wireframe Plane on Right -->
  <g opacity="0.6">
    <line x1="620" y1="180" x2="860" y2="60" class="grid-line" />
    <line x1="640" y1="200" x2="880" y2="80" class="grid-line" />
    <line x1="660" y1="220" x2="880" y2="110" class="grid-line" />
    <line x1="680" y1="240" x2="880" y2="140" class="grid-line" />
    <line x1="640" y1="60" x2="860" y2="170" class="grid-line" />
    <line x1="660" y1="80" x2="880" y2="190" class="grid-line" />
    <line x1="680" y1="100" x2="880" y2="210" class="grid-line" />
  </g>

  <!-- 3D Isometric Cube 1 (Large - Violet/Indigo) -->
  <g transform="translate(730, 95)" filter="url(#shadow)">
    <!-- Top Face -->
    <polygon points="0,-36 36,-18 0,0 -36,-18" fill="url(#c1-top)" />
    <!-- Left Face -->
    <polygon points="-36,-18 0,0 0,42 -36,24" fill="url(#c1-left)" />
    <!-- Right Face -->
    <polygon points="0,0 36,-18 36,24 0,42" fill="url(#c1-right)" />
  </g>

  <!-- 3D Isometric Cube 2 (Medium - Cyan/Sky) -->
  <g transform="translate(805, 175)" filter="url(#shadow)">
    <polygon points="0,-24 24,-12 0,0 -24,-12" fill="url(#c2-top)" />
    <polygon points="-24,-12 0,0 0,28 -24,16" fill="url(#c2-left)" />
    <polygon points="0,0 24,-12 24,16 0,28" fill="url(#c2-right)" />
  </g>

  <!-- 3D Isometric Cube 3 (Small Floating Accent) -->
  <g transform="translate(650, 60)" opacity="0.85" filter="url(#shadow)">
    <polygon points="0,-16 16,-8 0,0 -16,-8" fill="url(#c1-top)" />
    <polygon points="-16,-8 0,0 0,18 -16,10" fill="url(#c1-left)" />
    <polygon points="0,0 16,-8 16,10 0,18" fill="url(#c1-right)" />
  </g>

  <!-- Constellation Nodes & Connecting Rays -->
  <g opacity="0.7">
    <line x1="650" y1="60" x2="730" y2="95" stroke="#818CF8" stroke-width="1.2" stroke-dasharray="3 3" />
    <line x1="730" y1="137" x2="805" y2="175" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3 3" />
    <circle cx="650" cy="60" r="3" fill="#A5B4FC" />
    <circle cx="730" cy="95" r="3.5" fill="#C7D2FE" />
    <circle cx="805" cy="175" r="3" fill="#BAE6FD" />
  </g>

  <!-- Left Content Column -->
  <!-- Top Category Chip -->
  <g transform="translate(48, 42)">
    <rect x="0" y="0" width="220" height="22" rx="6" fill="#1E1B4B" stroke="#4338CA" stroke-width="1" />
    <circle cx="12" cy="11" r="3.5" fill="#6366F1" />
    <text x="24" y="15" class="badge-text">SYSTEMS &amp; AI ARCHITECT</text>
  </g>

  <!-- Main Hero Name -->
  <text x="48" y="106" class="title">NAVEEN CARLIN A</text>

  <!-- Professional Subtitle -->
  <text x="48" y="136" class="subtitle">AI &amp; Computer Vision Specialist • Distributed Systems • Edge IoT</text>

  <!-- 4 Interactive Glassmorphism 3D Pills -->
  <g transform="translate(48, 172)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="138" height="34" rx="8" fill="url(#pill-bg)" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#38BDF8" />
      <text x="28" y="21" class="pill-label">YOLOv8 Edge Vision</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(148, 0)">
      <rect x="0" y="0" width="138" height="34" rx="8" fill="url(#pill-bg)" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#818CF8" />
      <text x="28" y="21" class="pill-label">Java / Spring MVC</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(296, 0)">
      <rect x="0" y="0" width="138" height="34" rx="8" fill="url(#pill-bg)" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#34D399" />
      <text x="28" y="21" class="pill-label">Real-Time FastApi</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(444, 0)">
      <rect x="0" y="0" width="132" height="34" rx="8" fill="url(#pill-bg)" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#F472B6" />
      <text x="28" y="21" class="pill-label">MAPF Research</text>
    </g>
  </g>
</svg>
